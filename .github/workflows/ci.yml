name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The required check (protect-main): keep it fast.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: opt-deps
      # winit (via rune) links libxkbcommon.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      # rune, rune-kit, rune-ref, the [patch.crates-io] vendored crates and the README's install snippet must all
      # name one Rune rev.
      - run: test "$(grep -ho 'rev = "[0-9a-f]\{40\}"' Cargo.toml README.md | sort -u | wc -l)" = 1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  # Not required: the tests as release builds, where the builders' `debug_assert!` constraints are off and a
  # component renders what the oracle renders for an undefined combination.
  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-tests
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - run: cargo test --release -p spectrum-rune
  # Not required: the gallery scenes through Rune's CPU reference renderer (no GPU), in parallel.
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: gallery
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - run: cargo test --release -p spectrum-rune --example gallery -- --ignored render_scenes_to_png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery
          path: target/gallery/*.png
  # Not required: the platform manifest (platforms/rune) validates against the pinned foundation.
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: adobe/spectrum-design-data/.github/actions/validate@2836616b37bef88268cba27e57d9a4df7270dc4c # main on 2026-11-11
        with:
          cli-version: 0.33.0
          manifest: platforms/rune/manifest.json
          skip-dataset-validation: true
