name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The required check (protect-main): keep it fast.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: opt-deps
      # winit (via rune) links libxkbcommon.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  # Not required: the gallery scenes through Rune's CPU reference renderer (no GPU), in parallel.
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: gallery
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - run: cargo test --release -p spectrum-rune --example gallery -- --ignored render_scenes_to_png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery
          path: target/gallery/*.png
