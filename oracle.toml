# The oracle every committed generated file and fixture was made from: the RELEASED design-data
# CLI 0.63.5 (tag design-data-cli@0.63.5; take the release binary, Homebrew lags) and the dataset at the
# pinned release.
# Read by `cargo xtask gen` and by the tests/fixtures/regen-*.sh scripts; change it only together
# with a regeneration of all of them (see README, "The generator").
#
# cli_min / cli_max: accepted `design-data` versions, cli_min <= version < cli_max.
#   0.63.5 renders data 4.5.0 (spec 7.0.0; the Picker recipe arrived in 3.31.x, spectrum-design-data #2015). The bump from
#   0.36.5 / 3.15.1 changed upstream token names and sizes: docs/oracle-bump-3.31.1-deltas.md. Raise cli_max only with a data
#   release that matches the CLI's layout revision (the CLI warns when they differ).
#   0.32.0 was the first whose `catalog export` writes recipes (`visuals/`), so `cargo xtask gen` needs no
#   checkout; 0.31.0 the first whose `github` [source] fetches the render inputs.
# dataset: spectrum-design-data commit the committed files were made from: @adobe/spectrum-design-data@4.5.0,
#   the release platforms/rune/manifest.json and .design-data.toml pin.
cli_min = "0.63.5"
cli_max = "0.64.0"
dataset = "b1b4e8f"
