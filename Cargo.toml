[workspace]
resolver = "2"
members = ["crates/spectrum-rune", "xtask"]

[workspace.dependencies]
# Pre-release: pin a dev rev. Swap for a path to ~/repos/rune while hacking on the fork.
rune = { git = "https://github.com/anomalyco/rune", rev = "07c369b13e8bd82c3f0a74164bd132965de88830" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "07c369b13e8bd82c3f0a74164bd132965de88830" }
rune-ref = { git = "https://github.com/anomalyco/rune", rev = "07c369b13e8bd82c3f0a74164bd132965de88830", features = ["gpu"] }

# Dependencies (rune-ref's CPU renderer, png, blake3, ...) are optimised; our own crates stay
# unoptimised with debug assertions and overflow checks on. Pixel suites: ~69s -> ~16s locally.
[profile.dev.package."*"]
opt-level = 3
