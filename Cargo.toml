[workspace]
resolver = "2"
members = ["crates/spectrum-rune", "xtask"]

[workspace.dependencies]
# Pre-release: pin a dev rev. Swap for a path to ~/repos/rune while hacking on the fork.
rune = { git = "https://github.com/anomalyco/rune", rev = "d6d04d3e64180ba34ed4a976bb5fec9ff6769ad0" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "d6d04d3e64180ba34ed4a976bb5fec9ff6769ad0" }
rune-ref = { git = "https://github.com/anomalyco/rune", rev = "d6d04d3e64180ba34ed4a976bb5fec9ff6769ad0", features = ["gpu"] }

# Rune builds these crates as published plus its own patches under vendor/ (macOS IME hooks in winit, bidi L1 in
# parley_engine, ...) and a dependency's [patch] does not reach the app's workspace, so an app patches them too.
# Keep the rev equal to the rune rev above.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "d6d04d3e64180ba34ed4a976bb5fec9ff6769ad0" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "d6d04d3e64180ba34ed4a976bb5fec9ff6769ad0" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "d6d04d3e64180ba34ed4a976bb5fec9ff6769ad0" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "d6d04d3e64180ba34ed4a976bb5fec9ff6769ad0" }

# Dependencies (rune-ref's CPU renderer, png, blake3, ...) are optimised; our own crates stay
# unoptimised with debug assertions and overflow checks on; no debuginfo for them (CI disk). Pixel suites: ~69s -> ~16s locally.
[profile.dev.package."*"]
opt-level = 3
debug = false

# package."*" would otherwise optimise build scripts and proc-macros too (cold build 65 s vs 89 s).
[profile.dev.build-override]
opt-level = 0

# Backtraces stay usable; smaller binaries link and get scanned faster (macOS: no dsymutil step).
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
